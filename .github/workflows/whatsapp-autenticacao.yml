name: Validacao de autenticacao WhatsApp

on:
  push:
    branches: [feat/whatsapp-multicontas-autorizacao]
  pull_request:
    paths:
      - 'api/**'
      - 'tests/test_whatsapp_vinculos.py'
      - '.github/workflows/whatsapp-autenticacao.yml'

jobs:
  whatsapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias isoladas
        run: python -m pip install flask redis requests itsdangerous
      - name: Compilar modulos alterados
        run: python -m compileall -q api
      - name: Executar testes de vinculacao sem servidores externos
        run: python -m unittest discover -s tests -p test_whatsapp_vinculos.py -v
