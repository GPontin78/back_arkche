name: Validate private refunds history
on:
  push:
    branches:
      - 'fix/devolucoes-historico-conta-20261026'
  pull_request:
    paths:
      - 'estornos.py'
      - 'tests/test_estornos_regras.py'
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile estornos.py tests/test_estornos_regras.py
      - run: python -m unittest discover -s tests -p 'test_estornos_regras.py' -v
