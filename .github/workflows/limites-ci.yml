name: Validate limits backend
on:
  pull_request:
    paths:
      - 'limites.py'
      - 'tests/test_limites.py'
      - 'tests/test_limites_integracao_firebird.py'
      - '.github/workflows/limites-ci.yml'
  push:
    branches:
      - 'fix/limites-conta-sem-teto-e-ux'
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile limites.py tests/test_limites_integracao_firebird.py
      - run: python -m unittest discover -s tests -p 'test_limites.py' -v
